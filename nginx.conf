server {
    listen 80;
    server_name localhost;

    # Répertoire racine du build Angular
    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip pour de meilleures performances
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache navigateur pour les assets statiques (hachés par Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Règle principale : gestion du routage SPA Angular
    # Toutes les routes non trouvées renvoient vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend Spring Boot pour les appels API
    # Variable dynamique pour éviter les erreurs Nginx au démarrage hors Docker Compose
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_upstream "http://backend:8081/api/";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Masquer la version de Nginx (sécurité)
    server_tokens off;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
