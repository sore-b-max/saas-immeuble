@if (toast().visible) {
  <div class="fixed bottom-6 right-6 z-[100] transition-all duration-300 transform translate-y-0 opacity-100"
       [class.translate-y-10]="!toast().visible"
       [class.opacity-0]="!toast().visible">
    
    <div class="flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border"
         [ngClass]="{
           'bg-green-50 border-green-200 text-green-800': toast().type === 'success',
           'bg-red-50 border-red-200 text-red-800': toast().type === 'error',
           'bg-blue-50 border-blue-200 text-blue-800': toast().type === 'info'
         }">
      
      <!-- Icon -->
      <div>
        @if (toast().type === 'success') {
          <ng-icon name="lucideCheckCircle" class="text-green-500" size="20px"></ng-icon>
        }
        @if (toast().type === 'error') {
          <ng-icon name="lucideAlertCircle" class="text-red-500" size="20px"></ng-icon>
        }
        @if (toast().type === 'info') {
          <ng-icon name="lucideInfo" class="text-blue-500" size="20px"></ng-icon>
        }
      </div>

      <!-- Message -->
      <div class="font-medium text-sm pr-4">
        {{ toast().message }}
      </div>

      <!-- Close Button -->
      <button (click)="fermer()" class="ml-auto text-gray-400 hover:text-gray-600 transition-colors">
        <ng-icon name="lucideX" size="16px"></ng-icon>
      </button>

    </div>
  </div>
}
