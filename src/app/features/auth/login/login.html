<div class="h-screen w-full flex items-center justify-center p-4 relative overflow-hidden"
     style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c1225 100%);">

  <!-- Ambient Glow Orbs -->
  <div class="absolute -top-20 -left-20 w-80 h-80 rounded-full pointer-events-none bg-glow-1"
       style="background: rgba(59,130,246,0.25); filter: blur(80px);"></div>
  <div class="absolute -bottom-20 -right-20 w-80 h-80 rounded-full pointer-events-none bg-glow-2"
       style="background: rgba(99,102,241,0.25); filter: blur(80px);"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full pointer-events-none"
       style="background: rgba(59,130,246,0.07); filter: blur(80px);"></div>

  <!-- MAIN CARD -->
  <div class="floating-container floating-card w-full max-w-4xl rounded-3xl overflow-hidden relative z-10 grid grid-cols-1 lg:grid-cols-2"
       style="max-height: 94vh;
              background: rgba(255,255,255,0.08); backdrop-filter: blur(24px);
              border: 1px solid rgba(255,255,255,0.15);
              box-shadow: 0 25px 60px -15px rgba(37,99,235,0.25);">

    <!-- ==========================================
         LEFT PANEL — CARROUSEL SWIPER AUTOMATIQUE
         Swiper Web Component: loop, autoplay-delay="3000"
         ========================================== -->
    <div class="relative overflow-hidden min-h-[420px] h-full">

      <!-- BRAND HEADER (au-dessus du swiper) -->
      <div class="absolute top-0 left-0 right-0 z-20 flex items-center gap-3 p-6 pointer-events-none">
        <div class="w-10 h-10 flex items-center justify-center rounded-xl border pointer-events-auto"
             style="background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); border-color: rgba(255,255,255,0.28);">
          <ng-icon name="lucideBuilding" class="text-white" style="font-size:1.1rem;"></ng-icon>
        </div>
        <div class="flex-1 pointer-events-auto">
          <div class="flex items-center gap-2">
            <span class="text-white font-black text-base tracking-tight">SaaS Immeuble</span>
            <span class="text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-widest"
                  style="background:rgba(59,130,246,0.28); color:#bfdbfe; border:1px solid rgba(96,165,250,0.38);">Pro</span>
          </div>
          <span class="block text-[10px] uppercase tracking-widest font-semibold" style="color:#cbd5e1;">Gestion Immobilière</span>
        </div>
        <span class="flex items-center gap-1.5 text-[11px] font-semibold px-3 py-1 rounded-full border pointer-events-auto"
              style="color:white; background:rgba(255,255,255,0.13); border-color:rgba(255,255,255,0.2); backdrop-filter:blur(4px); white-space:nowrap;">
          <span class="w-2 h-2 rounded-full animate-pulse" style="background:#34d399;"></span>
          Service Opérationnel
        </span>
      </div>

      <!-- SWIPER CONTAINER DEFILANT AUTOMATIQUMENT -->
      <swiper-container
        slides-per-view="1"
        autoplay='{"delay": 3000, "disableOnInteraction": false}'
        loop="true"
        pagination='{"clickable": true}'
        effect="fade"
        speed="800"
        class="w-full h-full block">

        @for (slide of slides; track $index) {
          <swiper-slide class="relative w-full h-full flex flex-col justify-end">
            <img [src]="slide.image" [alt]="slide.title"
                 class="absolute inset-0 w-full h-full object-cover"
                 style="filter: brightness(0.82);">
            <!-- Gradient overlay pour lisibilité du texte -->
            <div class="absolute inset-0"
                 style="background: linear-gradient(to top, rgba(15,23,42,0.97) 0%, rgba(15,23,42,0.55) 50%, rgba(30,27,75,0.3) 100%);">
            </div>

            <!-- SLIDE CONTENT (texte + badge) -->
            <div class="relative z-10 p-6 pb-12">
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider mb-2 border"
                   style="background:rgba(59,130,246,0.28); color:#bfdbfe; border-color:rgba(96,165,250,0.28); backdrop-filter:blur(4px);">
                <ng-icon name="lucideSparkles" style="color:#fbbf24; font-size:0.75rem;"></ng-icon>
                {{ slide.badge }}
              </div>
              <h1 class="text-xl font-extrabold text-white leading-snug tracking-tight mb-2"
                  style="text-shadow: 0 2px 8px rgba(0,0,0,0.5);">
                {{ slide.title }}
              </h1>
              <p class="text-xs leading-relaxed font-medium" style="color:#cbd5e1; text-shadow: 0 1px 4px rgba(0,0,0,0.4);">
                {{ slide.subtitle }}
              </p>
            </div>
          </swiper-slide>
        }
      </swiper-container>

    </div><!-- /left panel -->

    <!-- RIGHT PANEL — FORMULAIRE DE CONNEXION -->
    <div class="p-6 lg:p-8 flex flex-col justify-center" style="background: rgba(255,255,255,0.97); backdrop-filter: blur(8px);">
      <div class="max-w-sm mx-auto w-full">

        <div class="mb-5">
          <div class="inline-flex items-center gap-1.5 text-[11px] font-semibold mb-2 px-3 py-1 rounded-full border"
               style="background:#eff6ff; color:#1d4ed8; border-color:#dbeafe;">
            <ng-icon name="lucideShieldCheck" style="font-size:0.75rem;"></ng-icon>
            Accès Sécurisé SSL
          </div>
          <h2 class="text-2xl font-black tracking-tight" style="color:#0f172a;">Espace Connexion</h2>
          <p class="text-xs mt-1" style="color:#64748b;">Entrez vos identifiants pour accéder à votre espace</p>
        </div>

        <form class="space-y-4" (ngSubmit)="onSubmit()">

          <!-- Email -->
          <div>
            <label for="email" class="block text-[11px] font-bold uppercase tracking-wider mb-1" style="color:#374151;">
              Adresse Email
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <ng-icon name="lucideMail" style="color:#94a3b8; font-size:1rem;"></ng-icon>
              </div>
              <input id="email" name="email" type="email" autocomplete="email" required
                     [(ngModel)]="email"
                     class="block w-full pl-9 pr-3 py-2.5 text-xs rounded-xl border transition-all"
                     style="border-color:#e2e8f0; background:rgba(248,250,252,0.7); color:#1e293b;"
                     placeholder="proprietaire@saas.com">
            </div>
          </div>

          <!-- Mot de passe -->
          <div>
            <label for="password" class="block text-[11px] font-bold uppercase tracking-wider mb-1" style="color:#374151;">
              Mot de passe
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <ng-icon name="lucideLock" style="color:#94a3b8; font-size:1rem;"></ng-icon>
              </div>
              <input id="password" name="password" [type]="showPassword ? 'text' : 'password'"
                     autocomplete="current-password" required
                     [(ngModel)]="password"
                     class="block w-full pl-9 pr-10 py-2.5 text-xs rounded-xl border transition-all"
                     style="border-color:#e2e8f0; background:rgba(248,250,252,0.7); color:#1e293b;"
                     placeholder="••••••••">
              <button type="button" (click)="toggleShowPassword()"
                      class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer"
                      style="background:none; border:none; color:#94a3b8;">
                <ng-icon [name]="showPassword ? 'lucideEyeOff' : 'lucideEye'" style="font-size:1rem;"></ng-icon>
              </button>
            </div>
          </div>

          <!-- Se souvenir -->
          <div class="flex items-center">
            <label class="flex items-center gap-2 cursor-pointer select-none text-[11px]" style="color:#475569;">
              <input id="remember-me" name="remember-me" type="checkbox"
                     class="w-3.5 h-3.5 rounded cursor-pointer" style="accent-color:#2563eb;">
              <span>Se souvenir de moi</span>
            </label>
          </div>

          <!-- Bouton connexion -->
          <button type="submit" [disabled]="isLoading"
                  class="w-full flex justify-center items-center gap-2 py-3 px-4 rounded-xl text-xs font-bold text-white cursor-pointer transition-all duration-200 hover:opacity-95"
                  style="background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); border:none; box-shadow: 0 4px 15px rgba(37,99,235,0.4);">
            <span *ngIf="!isLoading">Se connecter</span>
            <span *ngIf="isLoading" class="flex items-center gap-2">
              <app-lottie-player path="/assets/animations/loading-spinner.json" width="20px" height="20px" [loop]="true">
              </app-lottie-player>
              Connexion en cours...
            </span>
            <ng-icon *ngIf="!isLoading" name="lucideArrowRight" style="font-size:1rem;"></ng-icon>
          </button>

          <!-- Comptes démo -->
          <div class="mt-3 p-3 rounded-xl border" style="background:rgba(248,250,252,0.9); border-color:#e2e8f0;">
            <p class="flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider mb-2" style="color:#374151;">
              <ng-icon name="lucideSparkles" style="color:#f59e0b; font-size:0.75rem;"></ng-icon>
              Comptes Démo (Clic pour remplir) :
            </p>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" (click)="fillDemo('admin')"
                      class="text-left p-2 rounded-lg border cursor-pointer transition-all duration-200"
                      style="background:white; border-color:#e2e8f0;">
                <span class="block text-[11px] font-bold" style="color:#2563eb;">Propriétaire</span>
                <span class="block text-[10px] truncate" style="color:#64748b;">admin&#64;saas.com</span>
              </button>
              <button type="button" (click)="fillDemo('locataire')"
                      class="text-left p-2 rounded-lg border cursor-pointer transition-all duration-200"
                      style="background:white; border-color:#e2e8f0;">
                <span class="block text-[11px] font-bold" style="color:#4f46e5;">Locataire</span>
                <span class="block text-[10px] truncate" style="color:#64748b;">locataire&#64;saas.com</span>
              </button>
            </div>
          </div>

        </form>
      </div>
    </div><!-- /right panel -->

  </div><!-- /main card -->
</div><!-- /page -->
