<div class="p-6 bg-gray-50 min-h-screen font-sans">
  
  <!-- En-tête -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
    <div>
      <div class="flex items-center gap-3">
        <a routerLink="/" class="text-blue-600 hover:text-blue-800 transition-colors">
          <ng-icon name="lucideHome" size="24px"></ng-icon>
        </a>
        <h1 class="text-3xl font-bold text-gray-800">Paramètres de l'Immeuble</h1>
      </div>
      <p class="text-gray-500 mt-2 text-sm">Configurez les informations globales qui apparaîtront sur les quittances.</p>
    </div>
    
    <div>
      <button (click)="sauvegarder()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-5 rounded-lg shadow-md transition-all flex items-center gap-2">
        <ng-icon name="lucideSave" size="20px"></ng-icon>
        Enregistrer les modifications
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Colonne Principale: Infos générales -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- Card: Informations du Bâtiment -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
          <h2 class="text-lg font-bold text-gray-800">Informations de la Propriété</h2>
        </div>
        <div class="p-6 space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Nom de l'immeuble ou de la résidence *</label>
            <input type="text" [(ngModel)]="form.nom" placeholder="Ex: Résidence Les Palmiers" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Adresse *</label>
              <input type="text" [(ngModel)]="form.adresse" placeholder="Ex: Secteur 10, Ouaga 2000" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Ville *</label>
              <input type="text" [(ngModel)]="form.ville" placeholder="Ex: Ouagadougou" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>
        </div>
      </div>

      <!-- Card: Informations du Propriétaire / Gérant -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
          <h2 class="text-lg font-bold text-gray-800">Informations du Propriétaire / Gérant</h2>
        </div>
        <div class="p-6 space-y-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Nom complet du Gérant / Propriétaire *</label>
              <input type="text" [(ngModel)]="form.nomProprietaire" placeholder="Ex: Jean Dupont" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1.5">Téléphone de contact</label>
              <input type="text" [(ngModel)]="form.telephone" placeholder="Ex: +226 70 00 00 00" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Devise par défaut</label>
            <select [(ngModel)]="form.devise" class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
              <option value="FCFA">Franc CFA (FCFA)</option>
              <option value="EUR">Euro (€)</option>
              <option value="USD">Dollar ($)</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Colonne Latérale: Logo -->
    <div class="space-y-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
          <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
            <ng-icon name="lucideImage" size="20px" class="text-gray-500"></ng-icon>
            Logo de l'Immeuble
          </h2>
        </div>
        <div class="p-6">
          <p class="text-sm text-gray-500 mb-4">Ce logo apparaîtra dynamiquement sur vos factures et quittances PDF.</p>
          
          <!-- Zone d'affichage du logo -->
          <div class="border-2 border-dashed border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center bg-gray-50 mb-4 min-h-[160px]">
            <ng-container *ngIf="form.logoUrl; else noLogo">
              <img [src]="form.logoUrl" alt="Logo de l'immeuble" class="max-h-32 object-contain rounded">
            </ng-container>
            <ng-template #noLogo>
              <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-gray-400 mb-3">
                <ng-icon name="lucideImage" size="28px"></ng-icon>
              </div>
              <p class="text-sm text-gray-500 font-medium">Aucun logo configuré</p>
            </ng-template>
          </div>

          <!-- Actions -->
          <div class="flex flex-col gap-3">
            <label class="cursor-pointer bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg text-center text-sm transition-colors shadow-sm flex items-center justify-center gap-2">
              <ng-icon name="lucideUpload" size="18px"></ng-icon>
              {{ form.logoUrl ? 'Changer de logo' : 'Importer un logo' }}
              <!-- Input file masqué -->
              <input type="file" class="hidden" accept="image/png, image/jpeg, image/jpg" (change)="onFileSelected($event)">
            </label>
            
            <button *ngIf="form.logoUrl" (click)="supprimerLogo()" class="text-red-600 hover:text-red-700 text-sm font-medium py-2 transition-colors flex items-center justify-center gap-2">
              <ng-icon name="lucideTrash2" size="16px"></ng-icon>
              Supprimer le logo
            </button>
          </div>
          
        </div>
      </div>
    </div>
    
  </div>
</div>
